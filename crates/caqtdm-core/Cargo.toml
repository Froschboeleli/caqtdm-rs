[package]
name = "caqtdm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared types for the caQtDM Rust display manager: colors, channels, macros, calc, and value formatting."
rust-version.workspace = true

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
regex.workspace = true
pyo3 = { version = "0.23", optional = true, features = ["auto-initialize"] }
