[workspace]
resolver = "2"
members = [
    "crates/caqtdm-core",
    "crates/caqtdm-ui",
    "crates/caqtdm-datasource",
    "crates/caqtdm-epics-ca",
    "crates/caqtdm-epics-pva",
    "crates/caqtdm-widgets",
    "crates/caqtdm-paint",
    "crates/caqtdm-plugin",
    "crates/caqtdm-plugin-example",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["caQtDM Rust rewrite"]
rust-version = "1.85"

[workspace.dependencies]
thiserror = "2"
regex = "1"
caqtdm-core = { path = "crates/caqtdm-core" }
caqtdm-ui = { path = "crates/caqtdm-ui" }
caqtdm-datasource = { path = "crates/caqtdm-datasource" }
caqtdm-epics-ca = { path = "crates/caqtdm-epics-ca" }
caqtdm-epics-pva = { path = "crates/caqtdm-epics-pva" }
caqtdm-widgets = { path = "crates/caqtdm-widgets" }
caqtdm-paint = { path = "crates/caqtdm-paint" }
caqtdm-plugin = { path = "crates/caqtdm-plugin" }
