[package]
name = "caqtdm-datasource"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Control-system plugins for the caQtDM Rust rewrite"

[features]
default = ["libgmv"]
# Reconstructed HIPA/PRO logger. The site libgmv library is not in the
# upstream tree, so this codec is not a verified copy of that library.
libgmv = []

[dependencies]
caqtdm-core.workspace = true
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
crypto_box = "0.9"
crypto_secretbox = "0.1"
hmac = "0.12"
rand = "0.8"
rcgen = "0.12"
rsa = { version = "0.9", features = ["sha1", "sha2"] }
sha1 = "0.10"
sha2 = "0.10"
x509-parser = "0.16"
